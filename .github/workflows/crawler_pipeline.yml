name: Telegram Crawler & Parquet Sync

on:
  schedule:
    # يعمل كل 30 دقيقة آلياً
    - cron: '*/30 * * * *'
  # يتيح لك تشغيله يدوياً بنقرة زر للتجربة في أي وقت
  workflow_dispatch:

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub aiohttp beautifulsoup4

      - name: Run Telegram Crawler
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          mkdir -p crawler_output
          python run_crawler.py

      - name: Sync and Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python update_pipeline.py
