<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستكشف تيليجرام</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-wasm.js"></script>
    <style>
        :root {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0b1120;
            --border: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* شريط علوي متناسق ومستقر */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
        }

        .header-content {
            max-width: 680px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .year-select {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .search-bar {
            display: flex;
            gap: 8px;
        }

        .search-bar input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
        }

        .search-bar button {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* الحاوية وبطاقات المنشورات */
        .container {
            max-width: 680px;
            margin: 16px auto;
            padding: 0 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary);
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .channel-name {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .channel-name:hover {
            color: var(--primary);
        }

        .post-date {
            color: var(--text-sub);
            font-size: 0.75rem;
            direction: ltr;
        }

        .media-wrapper {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-wrapper img {
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            display: block;
        }

        .media-wrapper iframe {
            width: 100%;
            min-height: 340px;
            border: none;
            background: #000;
        }

        .card-body {
            padding: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .card-body a {
            color: var(--primary);
            text-decoration: none;
        }

        .card-body a:hover {
            text-decoration: underline;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* رسائل الحالة */
        .state-message {
            text-align: center;
            padding: 30px 15px;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="header-row">
                <div class="logo">⚡ مستكشف تيليجرام</div>
                <select id="yearSelect" class="year-select" onchange="onYearChange(this.value)">
                    <option value="2026">2026</option>
                </select>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="ابحث في محتوى المنشورات..." onkeypress="if(event.key === 'Enter') triggerSearch()">
                <button onclick="triggerSearch()">بحث</button>
            </div>
        </div>
    </header>

    <main class="container" id="feed"></main>

    <div class="state-message" id="statusMessage">
        <div class="spinner"></div>
        جارٍ الاتصال بقاعدة البيانات السحابية...
    </div>

    <script>
        const REPO = "Moo408/dat-9f82c4";
        const BASE_URL = `https://huggingface.co/datasets/${REPO}/resolve/main/`;

        let db = null;
        let conn = null;
        let activeYear = "2026";
        let offset = 0;
        const LIMIT = 20;
        let isQuerying = false;
        let hasMorePosts = true;
        let currentSearch = "";

        async function init() {
            try {
                const bundles = duckdb.getJsDelivrBundles();
                const bundle = await duckdb.selectBundle(bundles);
                const worker = await duckdb.createWorker(bundle.mainWorker);
                db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                conn = await db.connect();

                await loadManifest();
                await registerYearFile(activeYear);
                await loadPosts(true);
            } catch (err) {
                console.error("Initialization Failed:", err);
                showStatus("تعذر بدء الاتصال بمحرك البحث، يرجى إعادة المحاولة.", false);
            }
        }

        async function loadManifest() {
            try {
                const res = await fetch(`${BASE_URL}manifest.json`);
                if (!res.ok) return;
                const manifest = await res.json();
                const select = document.getElementById("yearSelect");
                select.innerHTML = "";

                const years = Object.keys(manifest).sort((a, b) => b.localeCompare(a));
                years.forEach(y => {
                    const opt = document.createElement("option");
                    opt.value = y;
                    const count = Number(manifest[y].total_rows || 0).toLocaleString();
                    opt.textContent = y === "unknown" ? `غير مؤرخ (${count})` : `${y} (${count})`;
                    select.appendChild(opt);
                });

                if (years.includes("2026")) {
                    activeYear = "2026";
                    select.value = "2026";
                } else if (years.length > 0) {
                    activeYear = years[0];
                    select.value = years[0];
                }
            } catch (e) {
                console.warn("Manifest loading skipped:", e);
            }
        }

        async function registerYearFile(year) {
            const fileName = `posts_${year}.parquet`;
            const fileUrl = `${BASE_URL}${fileName}`;
            try {
                // تسجيل الملف بمساره المباشر الصافي لتمكين HTTP Range Requests
                await db.registerFileURL(fileName, fileUrl, duckdb.DuckDBDataProtocol.HTTP, false);
            } catch (e) {
                console.error("Registration error:", e);
            }
        }

        async function loadPosts(reset = false) {
            if (isQuerying || (!hasMorePosts && !reset)) return;
            isQuerying = true;

            const statusEl = document.getElementById("statusMessage");
            statusEl.style.display = "block";
            statusEl.innerHTML = '<div class="spinner"></div> جلب البيانات...';

            if (reset) {
                offset = 0;
                hasMorePosts = true;
                document.getElementById("feed").innerHTML = "";
            }

            const targetTable = `posts_${activeYear}.parquet`;
            let sql = "";

            if (currentSearch.trim()) {
                const sanitized = currentSearch.replace(/'/g, "''");
                sql = `
                    SELECT username, post_id, text, image, video, media_type, views, date 
                    FROM '${targetTable}' 
                    WHERE text ILIKE '%${sanitized}%' 
                    ORDER BY date DESC 
                    LIMIT ${LIMIT} OFFSET ${offset};
                `;
            } else {
                sql = `
                    SELECT username, post_id, text, image, video, media_type, views, date 
                    FROM '${targetTable}' 
                    ORDER BY date DESC 
                    LIMIT ${LIMIT} OFFSET ${offset};
                `;
            }

            try {
                const res = await conn.query(sql);
                const records = res.toArray().map(row => row.toJSON());

                if (records.length < LIMIT) {
                    hasMorePosts = false;
                }

                if (records.length === 0 && reset) {
                    showStatus("لا توجد منشورات متطابقة مع البحث.", false);
                    isQuerying = false;
                    return;
                }

                renderPosts(records);
                offset += records.length;

                if (!hasMorePosts) {
                    showStatus("وصلت إلى نهاية هذا الأرشيف.", false);
                } else {
                    statusEl.style.display = "none";
                }
            } catch (err) {
                console.error("Execution error:", err);
                showStatus("خطأ في قراءة الأرشيف المحدد.", false);
            } finally {
                isQuerying = false;
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById("feed");

            posts.forEach(p => {
                const card = document.createElement("article");
                card.className = "card";

                // استخراج الوسائط
                let mediaHtml = "";
                const isVideo = p.media_type === "video" || (p.video && p.video.trim() !== "");

                if (isVideo) {
                    mediaHtml = `
                        <div class="media-wrapper">
                            <iframe src="https://t.me/${p.username}/${p.post_id}?embed=1" allowfullscreen></iframe>
                        </div>
                    `;
                } else if (p.image && p.image.trim() !== "") {
                    mediaHtml = `
                        <div class="media-wrapper">
                            <img src="${p.image}" loading="lazy" onerror="this.parentElement.style.display='none'">
                        </div>
                    `;
                }

                const displayDate = p.date ? p.date.replace("T", " ").substring(0, 16) : "";
                const viewsFormatted = Number(p.views || 0).toLocaleString();

                card.innerHTML = `
                    <div class="card-header">
                        <div class="channel-info">
                            <div class="channel-avatar">${(p.username || "T")[0].toUpperCase()}</div>
                            <a href="https://t.me/${p.username}" target="_blank" class="channel-name">@${p.username}</a>
                        </div>
                        <span class="post-date">${displayDate}</span>
                    </div>
                    ${mediaHtml}
                    <div class="card-body">${formatBody(p.text || "")}</div>
                    <div class="card-footer">
                        <span>👁️ ${viewsFormatted} مشاهدة</span>
                        <a href="https://t.me/${p.username}/${p.post_id}" target="_blank">فتح في تليجرام ↗</a>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function formatBody(str) {
            if (!str) return "";
            return str.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank">${url}</a>`);
        }

        function showStatus(text, showSpinner = true) {
            const statusEl = document.getElementById("statusMessage");
            statusEl.style.display = "block";
            statusEl.innerHTML = showSpinner ? `<div class="spinner"></div> ${text}` : text;
        }

        async function onYearChange(year) {
            activeYear = year;
            await registerYearFile(year);
            await loadPosts(true);
        }

        function triggerSearch() {
            currentSearch = document.getElementById("searchInput").value;
            loadPosts(true);
        }

        // التمرير اللانهائي
        window.addEventListener("scroll", () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (!isQuerying && hasMorePosts) {
                    loadPosts(false);
                }
            }
        });

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
