<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مستكشف تيليجرام السحابي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-wasm.js"></script>
    <style>
        :root {
            --bg-page: #0b1120;
            --bg-card: #1e293b;
            --bg-input: #020617;
            --border: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
        }

        .header-box {
            max-width: 620px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .year-dropdown {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .search-row input:focus {
            border-color: var(--primary);
        }

        .search-row button {
            background: var(--primary);
            color: #0b1120;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .feed-container {
            max-width: 620px;
            margin: 12px auto;
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .channel-name {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .channel-name:hover {
            color: var(--primary);
        }

        .post-time {
            color: var(--text-sub);
            font-size: 0.75rem;
            direction: ltr;
        }

        .media-container {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container img {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            display: block;
        }

        .media-container iframe {
            width: 100%;
            min-height: 350px;
            border: none;
            background: #000;
        }

        .card-body {
            padding: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .card-body a {
            color: var(--primary);
            text-decoration: none;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.25);
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .status-box {
            text-align: center;
            padding: 24px 10px;
            color: var(--text-sub);
            font-size: 0.9rem;
            word-wrap: break-word;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-box">
            <div class="header-top">
                <div class="brand">⚡ تليجرام كلاود</div>
                <select id="yearSelect" class="year-dropdown" onchange="switchYear(this.value)">
                    <option value="2026">2026</option>
                </select>
            </div>
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="ابحث في نصوص المنشورات..." onkeypress="if(event.key === 'Enter') triggerSearch()">
                <button onclick="triggerSearch()">بحث</button>
            </div>
        </div>
    </header>

    <main class="feed-container" id="feed"></main>

    <div class="status-box" id="statusBox">
        <div class="spinner"></div>
        جارٍ تهيئة محرك البيانات...
    </div>

    <script>
        const REPO_ID = "Moo408/dat-9f82c4";
        const HF_BASE = `https://huggingface.co/datasets/${REPO_ID}/resolve/main/`;

        let db = null;
        let conn = null;
        let selectedYear = "2026";
        let offset = 0;
        const LIMIT = 20;
        let isFetching = false;
        let hasMore = true;
        let activeSearch = "";
        let currentTableName = "";

        async function init() {
            try {
                // 1. تحديد الحزم يدوياً لضمان توافقها
                const MANUAL_BUNDLES = {
                    mvp: {
                        mainModule: 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-mvp.wasm',
                        mainWorker: 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-browser-mvp.worker.js',
                    },
                    eh: {
                        mainModule: 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-eh.wasm',
                        mainWorker: 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/dist/duckdb-browser-eh.worker.js',
                    },
                };

                const bundle = await duckdb.selectBundle(MANUAL_BUNDLES);

                // 2. تحميل الـ Worker كـ Blob لتخطي حظر CORS على سيرفرات GitHub Pages
                const workerReq = await fetch(bundle.mainWorker);
                const workerText = await workerReq.text();
                const workerBlob = new Blob([workerText], { type: 'text/javascript' });
                const workerUrl = URL.createObjectURL(workerBlob);
                
                const worker = new Worker(workerUrl);

                // 3. تهيئة قاعدة البيانات
                db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(), worker);
                await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
                URL.revokeObjectURL(workerUrl);

                conn = await db.connect();

                await loadManifest();
                await setupPartition(selectedYear);
                await fetchFeed(true);
            } catch (err) {
                console.error("DuckDB Init Error:", err);
                setStatus(`فشل التهيئة الأولي:<br><span style="color:#f87171;font-size:0.8rem">${err.message || err}</span>`, false);
            }
        }

        async function loadManifest() {
            try {
                const res = await fetch(`${HF_BASE}manifest.json?v=${Date.now()}`);
                if (!res.ok) return;
                const manifest = await res.json();
                const select = document.getElementById("yearSelect");
                select.innerHTML = "";

                const years = Object.keys(manifest).sort((a, b) => b.localeCompare(a));
                years.forEach(y => {
                    const opt = document.createElement("option");
                    opt.value = y;
                    const rows = Number(manifest[y].total_rows || 0).toLocaleString();
                    opt.textContent = y === "unknown" ? `غير مؤرخ (${rows})` : `${y} (${rows})`;
                    select.appendChild(opt);
                });

                if (years.includes("2026")) {
                    selectedYear = "2026";
                    select.value = "2026";
                } else if (years.length > 0) {
                    selectedYear = years[0];
                    select.value = years[0];
                }
            } catch (e) {
                console.warn("Manifest loading skipped:", e);
            }
        }

        async function setupPartition(year) {
            const fileName = `posts_${year}.parquet`;
            const fileUrl = `${HF_BASE}${fileName}`;
            try {
                // الاعتماد على Virtual File System لتخطي قيود الروابط المباشرة
                await db.registerFileURL(fileName, fileUrl, duckdb.DuckDBDataProtocol.HTTP, false);
                currentTableName = fileName;
            } catch (e) {
                console.error("Registration error:", e);
                throw e;
            }
        }

        async function fetchFeed(isReset = false) {
            if (isFetching || (!hasMore && !isReset)) return;
            isFetching = true;

            const statusEl = document.getElementById("statusBox");
            statusEl.style.display = "block";
            statusEl.innerHTML = '<div class="spinner"></div> جلب البيانات من السحابة...';

            if (isReset) {
                offset = 0;
                hasMore = true;
                document.getElementById("feed").innerHTML = "";
            }

            let sql = "";
            if (activeSearch.trim()) {
                const cleanText = activeSearch.replace(/'/g, "''");
                sql = `
                    SELECT username, post_id, text, image, video, media_type, views, date 
                    FROM '${currentTableName}' 
                    WHERE text ILIKE '%${cleanText}%' 
                    ORDER BY date DESC 
                    LIMIT ${LIMIT} OFFSET ${offset};
                `;
            } else {
                sql = `
                    SELECT username, post_id, text, image, video, media_type, views, date 
                    FROM '${currentTableName}' 
                    ORDER BY date DESC 
                    LIMIT ${LIMIT} OFFSET ${offset};
                `;
            }

            try {
                const result = await conn.query(sql);
                const posts = result.toArray().map(row => row.toJSON());

                if (posts.length < LIMIT) {
                    hasMore = false;
                }

                if (posts.length === 0 && isReset) {
                    setStatus("لا توجد منشورات متطابقة مع البحث.", false);
                    isFetching = false;
                    return;
                }

                renderPosts(posts);
                offset += posts.length;

                if (!hasMore) {
                    setStatus("تم الوصول لنهاية هذا الأرشيف.", false);
                } else {
                    statusEl.style.display = "none";
                }
            } catch (err) {
                console.error("DuckDB Query Error:", err);
                setStatus(`خطأ في جلب البيانات:<br><span style="color:#f87171;font-size:0.8rem">${err.message || err}</span>`, false);
            } finally {
                isFetching = false;
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById("feed");

            posts.forEach(p => {
                const card = document.createElement("article");
                card.className = "card";

                let mediaHtml = "";
                const isVideo = p.media_type === "video" || (p.video && p.video.trim() !== "");

                if (isVideo) {
                    mediaHtml = `
                        <div class="media-container">
                            <iframe src="https://t.me/${p.username}/${p.post_id}?embed=1" allowfullscreen></iframe>
                        </div>
                    `;
                } else if (p.image && p.image.trim() !== "") {
                    mediaHtml = `
                        <div class="media-container">
                            <img src="${p.image}" loading="lazy" onerror="this.parentElement.style.display='none'">
                        </div>
                    `;
                }

                const postTime = p.date ? p.date.replace("T", " ").substring(0, 16) : "";
                const viewsCount = Number(p.views || 0).toLocaleString();

                card.innerHTML = `
                    <div class="card-header">
                        <div class="channel-info">
                            <div class="channel-avatar">${(p.username || "T")[0].toUpperCase()}</div>
                            <a href="https://t.me/${p.username}" target="_blank" class="channel-name">@${p.username}</a>
                        </div>
                        <span class="post-time">${postTime}</span>
                    </div>
                    ${mediaHtml}
                    <div class="card-body">${formatBody(p.text || "")}</div>
                    <div class="card-footer">
                        <span>👁️ ${viewsCount} مشاهدة</span>
                        <a href="https://t.me/${p.username}/${p.post_id}" target="_blank">فتح في تليجرام ↗</a>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        function formatBody(str) {
            if (!str) return "";
            return str.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank">${url}</a>`);
        }

        function setStatus(msg, showLoader = true) {
            const statusEl = document.getElementById("statusBox");
            statusEl.style.display = "block";
            statusEl.innerHTML = showLoader ? `<div class="spinner"></div> ${msg}` : msg;
        }

        async function switchYear(year) {
            selectedYear = year;
            await setupPartition(year);
            await fetchFeed(true);
        }

        function triggerSearch() {
            activeSearch = document.getElementById("searchInput").value;
            fetchFeed(true);
        }

        window.addEventListener("scroll", () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (!isFetching && hasMore) {
                    fetchFeed(false);
                }
            }
        });

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
