<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DevRadar • Telegram Intelligence Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --input-bg: #ffffff;
            --card-footer-bg: #f8fafc;
            --header-bg: rgba(255, 255, 255, 0.96);
            --avatar-bg: #e0f2fe;
            --theme-btn-bg: #f1f5f9;
            --theme-btn-text: #0f172a;
            --badge-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-page: #0b1120;
            --bg-card: #1e293b;
            --border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.2);
            --input-bg: #0f172a;
            --card-footer-bg: rgba(0, 0, 0, 0.2);
            --header-bg: rgba(15, 23, 42, 0.95);
            --avatar-bg: #0369a1;
            --theme-btn-bg: #334155;
            --theme-btn-text: #f8fafc;
            --badge-bg: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }

        header {
            position: sticky; top: 0; z-index: 1000;
            background: var(--header-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); padding: 10px 14px;
        }

        .header-content { max-width: 650px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
        .header-top-row { display: flex; justify-content: space-between; align-items: center; }

        .nav-tabs { display: flex; background: var(--badge-bg); padding: 3px; border-radius: 8px; gap: 2px; }
        .nav-tab-btn { background: transparent; border: none; padding: 5px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; color: var(--text-sub); cursor: pointer; }
        .nav-tab-btn.active { background: var(--bg-card); color: var(--primary); }

        .theme-toggle-btn { background: var(--theme-btn-bg); color: var(--theme-btn-text); border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

        .search-box-wrap { display: flex; gap: 6px; }
        .search-box-wrap input { flex: 1; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; }
        .search-box-wrap input:focus { border-color: var(--primary); }
        .search-box-wrap button { background: var(--primary); color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .lang-filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
        .lang-filters::-webkit-scrollbar { display: none; }
        .lang-btn { background: var(--theme-btn-bg); color: var(--text-main); border: 1px solid transparent; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .lang-btn.active { background: var(--primary); color: #fff; }

        .hashtags-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
        .hashtags-bar::-webkit-scrollbar { display: none; }
        .hashtag-pill { background: transparent; color: var(--primary); padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid var(--primary); }

        .container-box { max-width: 650px; margin: 12px auto; padding: 0 10px; display: flex; flex-direction: column; gap: 12px; }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        .card-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .channel-info { display: flex; align-items: center; gap: 10px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--avatar-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; }
        .channel-name { color: var(--text-main); text-decoration: none; font-weight: 700; font-size: 0.95rem; }
        .post-time { color: var(--text-sub); font-size: 0.75rem; margin-top: 2px; }

        .btn-trash { background: transparent; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--text-sub); }
        .btn-trash:hover { background: var(--danger-bg); color: var(--danger); }
        .btn-trash svg { width: 17px; height: 17px; fill: currentColor; }

        .media-container img { width: 100%; max-height: 480px; object-fit: contain; display: block; }
        .media-container iframe { width: 100%; min-height: 350px; border: none; background: #000; }

        .card-body { padding: 14px; font-size: 0.95rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
        .card-body a { color: var(--primary); text-decoration: none; }

        .btn-toggle-more { background: transparent; border: none; color: var(--primary); font-weight: 700; font-size: 0.88rem; cursor: pointer; padding: 6px 0 0; display: inline-block; }

        .card-footer { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--card-footer-bg); border-top: 1px solid var(--border); font-size: 0.82rem; color: var(--text-sub); }
        .card-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

        .explorer-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .explorer-title { font-size: 0.98rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }

        .item-card { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .item-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.92rem; color: var(--primary); text-decoration: none; }
        .item-preview { font-size: 0.8rem; color: var(--text-sub); line-height: 1.4; }
        .mention-badge { background: var(--badge-bg); color: var(--text-sub); padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; }

        .pill-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-badge { background: var(--input-bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }

        .status-box { text-align: center; padding: 20px 10px; color: var(--text-sub); font-size: 0.9rem; }
        .explorer-tools { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
        .explorer-tools input { flex:2 1 190px; min-width:140px; background:var(--input-bg); color:var(--text-main); border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
        .explorer-tools select { flex:1 1 145px; min-width:130px; max-width:100%; background:var(--input-bg); color:var(--text-main); border:1px solid var(--border); border-radius:8px; padding:8px; }
        .trend-badge,.category-badge { display:inline-flex; align-items:center; width:fit-content; border-radius:6px; padding:2px 7px; font-size:.7rem; font-weight:700; border:1px solid var(--border); color:var(--text-sub); background:var(--badge-bg); }
        .trend-trending { color:#15803d; border-color:#86efac; background:#f0fdf4; }
        .trend-rising { color:#0369a1; border-color:#7dd3fc; background:#f0f9ff; }
        .trend-new { color:#7c3aed; border-color:#c4b5fd; background:#f5f3ff; }
        [data-theme="dark"] .trend-trending { color:#86efac; background:#052e16; border-color:#166534; }
        [data-theme="dark"] .trend-rising { color:#7dd3fc; background:#082f49; border-color:#075985; }
        [data-theme="dark"] .trend-new { color:#c4b5fd; background:#2e1065; border-color:#5b21b6; }
        .discovery-meta { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
        .discovery-note { font-size:.76rem; color:var(--text-sub); line-height:1.45; }
        .nav-tab-btn,.theme-toggle-btn,.lang-btn,.search-box-wrap button,.hashtag-pill,.btn-toggle-more { min-height:40px; }
        .empty-state { padding:28px 16px; text-align:center; color:var(--text-sub); background:var(--bg-card); border:1px dashed var(--border); border-radius:12px; }
        .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="header-top-row">
                <div class="nav-tabs">
                    <button class="nav-tab-btn active" id="tabFeedBtn" onclick="switchView('feed')">⚡ Live Feed</button>
                    <button class="nav-tab-btn" id="tabExplorerBtn" onclick="switchView('explorer')">🔮 Discovery Hub</button>
                </div>
                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 Dark</button>
            </div>

            <div id="feedControls" style="display: flex; flex-direction: column; gap: 8px;">
                <div class="search-box-wrap">
                    <input type="text" id="searchInput" placeholder="Search 8,000+ curated posts..." onkeypress="if(event.key === 'Enter') triggerSearch()">
                    <button onclick="triggerSearch()">Search</button>
                </div>

                <div class="lang-filters">
                    <button class="lang-btn active" onclick="setLang('', this)">🌐 All</button>
                    <button class="lang-btn" onclick="setLang('ar', this)">🇦🇪 Arabic</button>
                    <button class="lang-btn" onclick="setLang('en', this)">🇬🇧 English</button>
                    <button class="lang-btn" onclick="setLang('other', this)">🔣 Others</button>
                </div>

                <div class="hashtags-bar" id="hashtagsBar"></div>
            </div>
        </div>
    </header>

    <main class="container-box" id="feedView"></main>
    <main class="container-box" id="explorerView" style="display: none;"></main>

    <div class="status-box" id="statusBox">
        <div class="spinner"></div>
        Loading data...
    </div>

    <script>
        const API_BASE = "https://tele-feed-api.mohamed-ahmed408408.workers.dev";
        const urlParams = new URLSearchParams(window.location.search);
        let adminToken = urlParams.get("admin") || sessionStorage.getItem("admin_token") || "";

        let isAdmin = false;
        let currentView = "feed";
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;
        let activeQuery = "";
        let activeLang = "";

        async function verifyAdminWithServer() {
            if (!adminToken) return;
            try {
                const res = await fetch(`${API_BASE}/api/verify_admin`, {
                    headers: { "X-Admin-Key": adminToken }
                });
                const data = await res.json();
                if (data.is_admin) {
                    isAdmin = true;
                    sessionStorage.setItem("admin_token", adminToken);
                }
            } catch (e) {}
        }

        function initTheme() {
            const savedTheme = localStorage.getItem("app_theme") || "light";
            document.documentElement.setAttribute("data-theme", savedTheme);
            updateThemeButton(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
            const nextTheme = currentTheme === "light" ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", nextTheme);
            localStorage.setItem("app_theme", nextTheme);
            updateThemeButton(nextTheme);
        }

        function updateThemeButton(theme) {
            const btn = document.getElementById("themeToggleBtn");
            if (btn) btn.innerHTML = theme === "dark" ? "☀️ Light" : "🌙 Dark";
        }
        initTheme();

        window.switchView = function(view) {
            currentView = view;
            const feedView = document.getElementById("feedView");
            const explorerView = document.getElementById("explorerView");
            const feedControls = document.getElementById("feedControls");
            const tabFeedBtn = document.getElementById("tabFeedBtn");
            const tabExplorerBtn = document.getElementById("tabExplorerBtn");

            if (view === "feed") {
                feedView.style.display = "flex";
                explorerView.style.display = "none";
                feedControls.style.display = "flex";
                tabFeedBtn.classList.add("active");
                tabExplorerBtn.classList.remove("active");
            } else {
                feedView.style.display = "none";
                explorerView.style.display = "flex";
                feedControls.style.display = "none";
                tabFeedBtn.classList.remove("active");
                tabExplorerBtn.classList.add("active");
                loadExplorerData();
            }
        };

        let explorerData = null;
        let explorerCategory = "all";
        let explorerTrend = "all";
        let explorerFunction = "all";
        let explorerSort = "relevance";
        async function loadExplorerData() {
            const explorerView = document.getElementById("explorerView");
            const statusEl = document.getElementById("statusBox");
            if (explorerData) { renderExplorer(); return; }
            explorerView.innerHTML = "";
            statusEl.style.display = "block";
            statusEl.innerHTML = '<div class="spinner"></div>Loading discovery data…';

            try {
                const res = await fetch(`${API_BASE}/api/explorer`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                explorerData = await res.json();
                statusEl.style.display = "none";
                renderExplorer();
                return;

            } catch (err) {
                statusEl.innerHTML = `Could not load discovery data. <button onclick="explorerData=null;loadExplorerData()">Try again</button>`;
            }
        }

        function renderExplorer() {
            const explorerView = document.getElementById("explorerView");
            const oldSearch = document.getElementById("explorerSearch");
            const searchFocused = oldSearch === document.activeElement;
            const cursor = oldSearch?.selectionStart ?? 0;
            const data = explorerData || {};
            const query = (oldSearch?.value || "").trim().toLowerCase();
            const safe = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
            const safeLink = value => {
                try {
                    const url = new URL(value);
                    return ["https:", "http:"].includes(url.protocol) ? safe(url.href) : "#";
                } catch (_) { return "#"; }
            };
            const option = (value, label, current) =>
                '<option value="' + safe(value) + '"' + (current === value ? ' selected' : '') + '>' + safe(label) + '</option>';

            let html = '<div class="explorer-tools">' +
                '<input id="explorerSearch" type="search" placeholder="Search tools, repos, channels…" value="' + safe(query) + '" oninput="renderExplorer()">' +
                '<select aria-label="Discovery group" onchange="explorerCategory=this.value;renderExplorer()">' +
                    option("all", "All discoveries", explorerCategory) +
                    option("rising", "Rising discoveries", explorerCategory) +
                    option("new", "New discoveries", explorerCategory) +
                    option("ai", "AI tools", explorerCategory) +
                    option("web", "Web gems", explorerCategory) +
                    option("repos", "GitHub repos", explorerCategory) +
                    option("packages", "Packages", explorerCategory) +
                    option("domains", "Top domains", explorerCategory) +
                '</select>' +
                '<select aria-label="Function category" onchange="explorerFunction=this.value;renderExplorer()">' +
                    option("all", "All functions", explorerFunction) +
                    option("ai_coding_agents", "AI Coding & Agents", explorerFunction) +
                    option("local_ai", "Local AI & Models", explorerFunction) +
                    option("creative_ai", "Image, Video & Audio AI", explorerFunction) +
                    option("automation_api", "Automation, MCP & APIs", explorerFunction) +
                    option("self_hosted_devtools", "Self-hosted & Dev Tools", explorerFunction) +
                    option("ai_tools", "AI Tools", explorerFunction) +
                    option("web_utilities", "Developer Utilities", explorerFunction) +
                '</select>' +
                '<select aria-label="Trend filter" onchange="explorerTrend=this.value;renderExplorer()">' +
                    option("all", "Any trend status", explorerTrend) +
                    option("trending", "Trending", explorerTrend) +
                    option("rising", "Rising", explorerTrend) +
                    option("new", "New", explorerTrend) +
                    option("popular", "Popular", explorerTrend) +
                    option("active", "Active", explorerTrend) +
                    option("insufficient_data", "Insufficient data", explorerTrend) +
                '</select>' +
                '<select aria-label="Sort discoveries" onchange="explorerSort=this.value;renderExplorer()">' +
                    option("relevance", "Default ranking", explorerSort) +
                    option("trend", "Trend score", explorerSort) +
                    option("growth", "Growth rate", explorerSort) +
                    option("newest", "Latest source post", explorerSort) +
                    option("mentions", "Most mentions", explorerSort) +
                    option("channels", "Most channels", explorerSort) +
                    option("views", "Source-post view gain", explorerSort) +
                '</select></div>';

            const trendLabel = item => item.trend_status_label || ({
                trending: "Trending", rising: "Rising", new: "New", popular: "Popular",
                active: "Active", insufficient_data: "Insufficient data"
            }[item.trend_status] || "Insufficient data");
            const toDisplay = item => Object.assign({}, item, {
                title: item.title || item.domain || item.package || "",
                preview: item.preview || item.sample || "",
                url: item.url || (item.domain ? "https://" + item.domain : "")
            });
            const matches = item => {
                const searchable = [
                    item.title, item.preview, item.channel, item.package, item.url, item.domain,
                    item.category, item.category_label, item.trend_status, item.trend_status_label
                ].join(" ").toLowerCase();
                if (query && !searchable.includes(query)) return false;
                if (explorerTrend !== "all" && item.trend_status !== explorerTrend) return false;
                if (explorerFunction !== "all" && item.category !== explorerFunction) return false;
                return true;
            };
            const sortItems = items => {
                const sorted = items.map(toDisplay).slice();
                const num = value => Number.isFinite(Number(value)) ? Number(value) : -1;
                if (explorerSort === "trend") {
                    sorted.sort((a,b) => num(b.trend_score) - num(a.trend_score) || num(b.mentions_6h) - num(a.mentions_6h));
                } else if (explorerSort === "growth") {
                    sorted.sort((a,b) => num(b.growth_ratio) - num(a.growth_ratio) || num(b.trend_score) - num(a.trend_score));
                } else if (explorerSort === "newest") {
                    sorted.sort((a,b) => String(b.latest_post_at || b.date || "").localeCompare(String(a.latest_post_at || a.date || "")));
                } else if (explorerSort === "mentions") {
                    sorted.sort((a,b) => num(b.mentions) - num(a.mentions));
                } else if (explorerSort === "channels") {
                    sorted.sort((a,b) => num(b.unique_channels) - num(a.unique_channels));
                } else if (explorerSort === "views") {
                    sorted.sort((a,b) => num(b.source_post_views_per_hour) - num(a.source_post_views_per_hour));
                }
                return sorted;
            };
            const formatNumber = value => Number(value || 0).toLocaleString();
            const formatAge = value => {
                if (value === null || value === undefined || value === "") return "";
                const minutes = Math.max(0, Number(value) || 0);
                if (minutes < 60) return Math.round(minutes) + "m ago";
                if (minutes < 1440) return Math.floor(minutes / 60) + "h ago";
                return Math.floor(minutes / 1440) + "d ago";
            };
            const formatDate = value => String(value || "").substring(0,16).replace("T"," ");
            const linkCard = (item, icon, typeBadge) => {
                const trend = String(item.trend_status || "insufficient_data").toLowerCase();
                const trendClass = ["trending","rising","new"].includes(trend) ? " trend-" + trend : "";
                const uniqueChannels = Number(item.unique_channels || 0);
                const mentions = Number(item.mentions || 0);
                const category = item.category_label || "Developer Utilities";
                const latest = item.latest_post_at || item.date || "";
                const ageText = item.post_age_minutes !== null && item.post_age_minutes !== undefined
                    ? "Latest source post: " + formatAge(item.post_age_minutes)
                    : (latest ? "Latest source post: " + formatDate(latest) : "Latest source-post time unavailable");
                const sampleCount = Number(item.source_post_view_samples || 0);
                let viewText = "View velocity waiting for repeat snapshots";
                if (sampleCount > 0 && item.source_post_views_delta !== null && item.source_post_views_delta !== undefined) {
                    const delta = Number(item.source_post_views_delta || 0);
                    const sign = delta > 0 ? "+" : "";
                    viewText = "Linked Telegram posts: " + sign + formatNumber(delta) + " views across " +
                        formatNumber(sampleCount) + " measured posts";
                    if (item.source_post_views_per_hour !== null && item.source_post_views_per_hour !== undefined) {
                        viewText += " · " + formatNumber(Math.round(Number(item.source_post_views_per_hour))) + " views/hour combined";
                    }
                }
                const channel = String(item.channel || "").trim().replace(/^@/,"");
                const source = channel
                    ? '<div class="discovery-note">Source channel: <a href="https://t.me/' + safe(encodeURIComponent(channel)) + '" target="_blank" rel="noopener noreferrer">@' + safe(channel) + '</a></div>'
                    : "";
                return '<div class="item-card">' +
                    '<div class="item-header"><a rel="noopener noreferrer" href="' + safeLink(item.url) + '" target="_blank" class="item-name">' +
                        icon + ' ' + safe(item.title) + '</a><span class="mention-badge">' + safe(typeBadge) + ' ' +
                        formatNumber(mentions) + ' posts · ' + formatNumber(uniqueChannels) + ' channels</span></div>' +
                    '<div class="discovery-meta"><span class="trend-badge' + trendClass + '">' + safe(trendLabel(item)) + '</span>' +
                        '<span class="category-badge">' + safe(category) + '</span>' +
                        '<span class="mention-badge">Trend ' + formatNumber(item.trend_score || 0) + '/100</span></div>' +
                    '<div class="item-preview">' + safe(String(item.preview || "").replace(/https?:\/\/[^\s]+/g,"").trim()) + '</div>' +
                    '<div class="discovery-note">' + safe(ageText) + ' · 6h posts: ' + formatNumber(item.mentions_6h || 0) +
                        ' · prior 24h: ' + formatNumber(item.mentions_previous_24h || 0) +
                        (item.growth_ratio !== null && item.growth_ratio !== undefined ? ' · growth ' + safe(item.growth_ratio) + 'x' : '') + '</div>' +
                    '<div class="discovery-note">' + safe(viewText) + '</div>' + source + '</div>';
            };
            const renderSection = (title, items, icon, badge) => {
                const displayed = sortItems(items || []).filter(matches);
                return '<div class="explorer-section"><div class="explorer-title">' + title +
                    ' (' + displayed.length + ')</div>' +
                    (displayed.length ? displayed.map(item => linkCard(item, icon, badge)).join("") :
                        '<div class="discovery-note">No items match these filters.</div>') + '</div>';
            };
            const allTrendItems = (data.top_rising || []).map(toDisplay);
            const allNewItems = (data.top_new || []).map(toDisplay);
            const domains = (data.top_100_domains || []).map(toDisplay);
            const packages = sortItems(data.top_packages || []).filter(matches);

            if (explorerCategory === "all" || explorerCategory === "rising") {
                html += renderSection("📈 Rising Discoveries", allTrendItems, "📈", "Rise");
            }
            if (explorerCategory === "all" || explorerCategory === "new") {
                html += renderSection("🆕 New Discoveries", allNewItems, "🆕", "New");
            }
            if (explorerCategory === "all" || explorerCategory === "ai") {
                html += renderSection("🤖 AI Tools & Portals", data.top_ai_tools || [], "🤖", "AI");
            }
            if (explorerCategory === "all" || explorerCategory === "web") {
                html += renderSection("🔮 Web Gems & Utilities", data.top_web_gems || [], "🌐", "Web");
            }
            if (explorerCategory === "all" || explorerCategory === "repos") {
                html += renderSection("🐙 GitHub Repositories", data.top_repos || [], "🐙", "Repo");
            }
            if (explorerCategory === "all" || explorerCategory === "packages") {
                html += '<div class="explorer-section"><div class="explorer-title">⚙️ Packages (' + packages.length + ')</div><div class="pill-grid">' +
                    packages.map(p => '<span class="tag-badge">⚙️ ' + safe(p.package) + ' <b style="color:var(--primary);font-size:.7rem">(' + formatNumber(p.mentions) + ')</b></span>').join("") +
                    '</div></div>';
            }
            if (explorerCategory === "all" || explorerCategory === "domains") {
                html += renderSection("🌐 Top Domains", domains, "🔗", "Domain");
            }

            const updated = data.updated_at ? formatDate(data.updated_at) + " UTC" : "unknown";
            const snapshotCount = Number((data.view_tracking || {}).posts_with_valid_repeat_snapshots || 0);
            html = '<div class="explorer-section"><div class="explorer-title">Discovery status</div>' +
                '<div class="discovery-note">Data updated: ' + safe(updated) +
                ' · Posts with repeat view snapshots: ' + formatNumber(snapshotCount) +
                '. Trend uses Telegram post publication timestamps; view gain uses measured Telegram post snapshots, not destination-site analytics.</div></div>' + html;

            explorerView.innerHTML = html;
            const newSearch = document.getElementById("explorerSearch");
            if (searchFocused && newSearch) {
                newSearch.focus();
                try { newSearch.setSelectionRange(cursor, cursor); } catch (_) {}
            }
            if (query && !explorerView.querySelector(".item-card, .tag-badge")) {
                explorerView.insertAdjacentHTML("beforeend", '<div class="empty-state">No discoveries match. Try another search or category.</div>');
            }
        }

        window.setLang = function(lang, btnElement) {
            activeLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');
            currentPage = 1;
            fetchFeed(true);
        };

        async function fetchFeed(isReset = false) {
            if (isFetching || (!hasMore && !isReset)) return;
            isFetching = true;

            const statusEl = document.getElementById("statusBox");
            if (statusEl) statusEl.style.display = "block";

            if (isReset) {
                if (!activeQuery.trim() && !activeLang) {
                    currentPage = Math.floor(Math.random() * 40) + 1;
                } else {
                    currentPage = 1;
                }
                hasMore = true;
                document.getElementById("feedView").innerHTML = "";
            }

            try {
                const url = `${API_BASE}/api/feed?page=${currentPage}&q=${encodeURIComponent(activeQuery)}&lang=${encodeURIComponent(activeLang)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.top_hashtags && data.top_hashtags.length > 0) {
                    const hashContainer = document.getElementById("hashtagsBar");
                    if (hashContainer) {
                        hashContainer.innerHTML = data.top_hashtags.map(tag => {
                            const safeTag = escapeHtml(tag);
                            return `<button class="hashtag-pill" onclick="searchHashtag(${escapeHtml(JSON.stringify(String(tag)))})">${safeTag}</button>`;
                        }).join('');
                    }
                }

                if (data.posts && data.posts.length > 0) {
                    renderPosts(data.posts);
                    currentPage++;
                    hasMore = data.has_more;
                } else if (isReset) {
                    if (currentPage > 1) {
                        currentPage = 1;
                        isFetching = false;
                        return fetchFeed(true);
                    }
                    document.getElementById("feedView").innerHTML = '<div class="status-box">No matching posts found.</div>';
                }

                if (!hasMore) {
                    if (statusEl) statusEl.innerText = "You have reached the end of the feed";
                } else {
                    if (statusEl) statusEl.style.display = "none";
                }
            } catch (err) {
                if (statusEl) statusEl.innerText = "Failed to connect to the server.";
            } finally {
                isFetching = false;
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById("feedView");

            posts.forEach(p => {
                const card = document.createElement("article");
                card.className = "card";
                card.setAttribute("data-username", (p.username || "").toLowerCase());

                let mediaHtml = "";
                const isVideo = p.media_type === "video" || (p.video && p.video.trim() !== "");
                const username = String(p.username || "").trim().replace(/^@/, "");
                const postId = String(p.post_id || "").replace(/[^0-9]/g, "");
                const imageUrl = (() => { try { const u = new URL(p.image); return u.protocol === "https:" ? escapeHtml(u.href) : ""; } catch { return ""; } })();

                if (isVideo) {
                    mediaHtml = `
                        <div class="media-container">
                            <iframe loading="lazy" title="Telegram video post" src="https://t.me/${username}/${postId}?embed=1" allowfullscreen></iframe>
                        </div>
                    `;
                } else if (imageUrl) {
                    mediaHtml = `
                        <div class="media-container">
                            <img src="${imageUrl}" alt="Post media" loading="lazy" onerror="this.parentElement.style.display='none'">
                        </div>
                    `;
                }

                const postTime = p.date ? p.date.replace("T", " ").substring(0, 16) : "";
                const viewsCount = Number(p.views || 0).toLocaleString();

                const trashBtnHtml = isAdmin ? `
                    <button class="btn-trash" title="Delete Channel" data-purge-username="${escapeHtml(username)}">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                ` : '';

                const fullRawText = p.text || "";
                let bodyHtml = "";

                if (fullRawText.length > 250) {
                    const shortText = fullRawText.substring(0, 250) + "...";
                    bodyHtml = `
                        <span class="text-preview">${formatBody(shortText)}</span>
                        <span class="text-full" style="display: none;">${formatBody(fullRawText)}</span>
                        <br>
                        <button class="btn-toggle-more" onclick="toggleReadMore(this)">Show more...</button>
                    `;
                } else {
                    bodyHtml = formatBody(fullRawText);
                }

                card.innerHTML = `
                    <div class="card-header">
                        <div class="channel-info">
                            <div class="channel-avatar">${escapeHtml((username || "T")[0].toUpperCase())}</div>
                            <div>
                                <a href="https://t.me/${username}" target="_blank" rel="noopener noreferrer" class="channel-name">@${escapeHtml(username)}</a>
                                <div class="post-time">${escapeHtml(postTime)}</div>
                            </div>
                        </div>
                        ${trashBtnHtml}
                    </div>
                    ${mediaHtml}
                    <div class="card-body">${bodyHtml}</div>
                    <div class="card-footer">
                        <span>👁️ ${viewsCount} views</span>
                        <a href="https://t.me/${username}/${postId}" target="_blank" rel="noopener noreferrer">Open on Telegram ↗</a>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        window.toggleReadMore = function(btn) {
            const cardBody = btn.parentElement;
            const previewEl = cardBody.querySelector(".text-preview");
            const fullEl = cardBody.querySelector(".text-full");

            if (fullEl.style.display === "none") {
                fullEl.style.display = "inline";
                previewEl.style.display = "none";
                btn.innerText = "Show less";
            } else {
                fullEl.style.display = "none";
                previewEl.style.display = "inline";
                btn.innerText = "Show more...";
            }
        };

        function escapeHtml(str) { return String(str ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
        function formatBody(str) {
            if (!str) return "";
            return escapeHtml(str).replace(/https?:\/\/[^\s&]+/g, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
        }

        window.triggerSearch = function() {
            activeQuery = document.getElementById("searchInput").value;
            fetchFeed(true);
        };

        window.searchHashtag = function(tag) {
            document.getElementById("searchInput").value = tag;
            activeQuery = tag;
            fetchFeed(true);
        };

        async function purgeChannel(username) {
            if (!isAdmin) return;
            const normalizedUsername = String(username || "").trim().replace(/^@/, "");
            if (!normalizedUsername) return;
            const cards = Array.from(document.querySelectorAll(".card")).filter(
                card => (card.dataset.username || "").toLowerCase() === normalizedUsername.toLowerCase()
            );
            const buttons = cards.flatMap(card => Array.from(card.querySelectorAll(".btn-trash")));
            const statusEl = document.getElementById("statusBox");
            buttons.forEach(button => { button.disabled = true; button.setAttribute("aria-label", `Removing @${normalizedUsername}…`); });
            try {
                const res = await fetch(`${API_BASE}/api/purge?username=${encodeURIComponent(normalizedUsername)}`, {
                    method: "POST",
                    headers: { "X-Admin-Key": adminToken }
                });
                const payload = await res.clone().json().catch(() => null);
                if (!res.ok || payload?.success === false || payload?.ok === false) {
                    throw new Error(payload?.error || payload?.message || `Server returned HTTP ${res.status}`);
                }
                cards.forEach(card => card.remove());
                statusEl.textContent = `Purge request accepted for @${normalizedUsername}.`;
                statusEl.style.display = "block";
            } catch (error) {
                buttons.forEach(button => { button.disabled = false; button.removeAttribute("aria-label"); });
                statusEl.textContent = `Could not purge @${normalizedUsername}. ${error.message}. Posts were kept; please retry.`;
                statusEl.style.display = "block";
            }
        }

        document.addEventListener("click", event => {
            const button = event.target.closest(".btn-trash[data-purge-username]");
            if (button) purgeChannel(button.dataset.purgeUsername);
        });

        window.addEventListener("scroll", () => {
            if (currentView === "feed" && (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (!isFetching && hasMore) fetchFeed(false);
            }
        });

        (async () => {
            await verifyAdminWithServer();
            fetchFeed(true);
        })();
    </script>
</body>
</html>
