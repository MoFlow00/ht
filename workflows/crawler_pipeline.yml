name: Telegram Crawler & Parquet Sync

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات (UTC)
    - cron: '0 */6 * * *'
  # يتيح لك تشغيله يدوياً بنقرة زر للتجربة
  workflow_dispatch:

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub aiohttp

      - name: Run Telegram Crawler
        run: |
          mkdir -p crawler_output
          # هنا تضع أمر تشغيل الكراولر الخاص بك
          # على أن يحفظ مخرجاته في crawler_output/p.parquet و crawler_output/c.parquet
          python run_crawler.py

      - name: Sync and Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          python update_pipeline.py
