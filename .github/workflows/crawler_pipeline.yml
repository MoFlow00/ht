name: Telegram Crawler & Parquet Sync

on:
  schedule:
    # يعمل آلياً كل 30 دقيقة
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow huggingface_hub aiohttp beautifulsoup4 requests

      - name: Run Telegram Crawler (Queue 1500)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        run: |
          mkdir -p crawler_output
          python run_crawler.py

      - name: Sync, Partition & Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          python update_pipeline.py
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
